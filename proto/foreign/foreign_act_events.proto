syntax = "proto3";

package ci.ec.foreign.v1;

import "google/protobuf/timestamp.proto";
import "proto/common/event_envelope.proto";
import "proto/common/code_types.proto";

option java_package = "ci.ec.foreign.v1";
option java_multiple_files = true;
option go_package = "github.com/kaderho/akwaba/gen/go/ci/ec/foreign/v1;foreignv1";

// ─────────────────────────────────────────
// ForeignAct Domain Events — topic: ci.ec.foreign_act.events.v1
// Subject SR2: ci.ec.foreign_act.events.v1-value
// ─────────────────────────────────────────

message ForeignActSnapshot {
  string foreign_act_id = 1;
  string country_code   = 2; // ISO-3166-1 alpha-2

  ci.ec.common.v1.CodeRef foreign_act_type = 3; // FOREIGN.ACT.TYPE.* (MDMV1)
  ci.ec.common.v1.CodeRef status           = 4; // FOREIGN.ACT.STATUS.* (MDMV1)

  repeated string document_ids = 10;

  google.protobuf.Timestamp received_at = 20;
}

message ForeignActReceived    { ForeignActSnapshot act = 1; }
message ForeignActTranscribed { ForeignActSnapshot act = 1; }
message ForeignActRejected    { ForeignActSnapshot act = 1; ci.ec.common.v1.CodeRef reason = 2; }

message ForeignActEvent {
  ci.ec.common.v1.EventEnvelope meta = 1;
  oneof payload {
    ForeignActReceived    received    = 10;
    ForeignActTranscribed transcribed = 11;
    ForeignActRejected    rejected    = 12;
  }
}
