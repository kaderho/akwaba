syntax = "proto3";

package ci.ec.mention.v1;

import "google/protobuf/timestamp.proto";
import "proto/common/event_envelope.proto";
import "proto/common/code_types.proto";

option java_package = "ci.ec.mention.v1";
option java_multiple_files = true;
option go_package = "github.com/kaderho/akwaba/gen/go/ci/ec/mention/v1;mentionv1";

// ─────────────────────────────────────────
// Mention Domain Events — topic: ci.ec.mention.events.v1
// Subject SR2: ci.ec.mention.events.v1-value
// ─────────────────────────────────────────

message MentionSnapshot {
  string mention_id      = 1;
  string civil_record_id = 2;

  ci.ec.common.v1.CodeRef mention_type  = 3;  // MENTION.TYPE.* (MDMV1)
  ci.ec.common.v1.CodeRef status        = 4;  // MENTION.STATUS.* (MDMV1)

  string reference_record_id = 5; // acte de référence (optionnel)
  string text                = 6;

  google.protobuf.Timestamp added_at     = 10;
  google.protobuf.Timestamp effective_at = 11;
}

message MentionAdded    { MentionSnapshot mention = 1; }
message MentionCancelled { MentionSnapshot mention = 1; ci.ec.common.v1.CodeRef reason = 2; }

message MentionEvent {
  ci.ec.common.v1.EventEnvelope meta = 1;
  oneof payload {
    MentionAdded     added     = 10;
    MentionCancelled cancelled = 11;
  }
}

// ─────────────────────────────────────────
// MentionSet Domain Events — topic: ci.ec.mention_set.events.v1
// Subject SR2: ci.ec.mention_set.events.v1-value
// ─────────────────────────────────────────

message MentionSetSnapshot {
  string civil_record_id        = 1;
  repeated MentionSnapshot mentions = 2;
  google.protobuf.Timestamp as_of = 10;
}

message MentionSetUpdated { MentionSetSnapshot mention_set = 1; }

message MentionSetEvent {
  ci.ec.common.v1.EventEnvelope meta = 1;
  oneof payload {
    MentionSetUpdated updated = 10;
  }
}
