syntax = "proto3";

package ci.ec.audit.v1;

import "google/protobuf/timestamp.proto";
import "proto/common/event_envelope.proto";
import "proto/common/code_types.proto";

option java_package = "ci.ec.audit.v1";
option java_multiple_files = true;
option go_package = "github.com/kaderho/akwaba/gen/go/ci/ec/audit/v1;auditv1";

// ─────────────────────────────────────────
// Audit Domain Events — topic: ci.ec.audit.events.v1
// Subject SR2: ci.ec.audit.events.v1-value
// ─────────────────────────────────────────

message AuditEntrySnapshot {
  string audit_id    = 1;
  google.protobuf.Timestamp at = 2;

  string actor_id   = 3;
  string actor_type = 4; // "agent" | "citizen" | "system"

  ci.ec.common.v1.CodeRef action = 10; // AUDIT.ACTION.* (MDMV1)
  string target_type             = 11;
  string target_id               = 12;

  string correlation_id = 20;

  // Pas de contenu nominatif — voir règle MDMV1
  map<string, string> details = 30;
}

message AuditLogged { AuditEntrySnapshot entry = 1; }

message AuditEvent {
  ci.ec.common.v1.EventEnvelope meta = 1;
  oneof payload {
    AuditLogged logged = 10;
  }
}
