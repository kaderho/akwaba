syntax = "proto3";

package ci.ec.common.v1;

option java_package = "ci.ec.common.v1";
option java_multiple_files = true;
option go_package = "github.com/kaderho/akwaba/gen/go/ci/ec/common/v1;commonv1";

// MDMV1: version OBLIGATOIRE dans tous les snapshots.
// (proto3 ne force pas required, mais la norme + validations doivent l'imposer)
message CodeRef {
  string system  = 1; // MUST be "CI-EC-MDM"
  string code    = 2; // ex: "SEX.MALE"
  string version = 3; // ex: "2026-04" (MUST be set in every snapshot — MDMV1)
}
