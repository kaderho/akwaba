syntax = "proto3";

package ci.ec.registry.v1;

import "google/protobuf/timestamp.proto";
import "proto/common/event_envelope.proto";

option java_package = "ci.ec.registry.v1";
option java_multiple_files = true;
option go_package = "github.com/kaderho/akwaba/gen/go/ci/ec/registry/v1;registryv1";

// ─────────────────────────────────────────
// AnnualTable Domain Events — topic: ci.ec.annual_table.events.v1
// Subject SR2: ci.ec.annual_table.events.v1-value
// ─────────────────────────────────────────

message AnnualTableItem {
  string civil_record_id = 1;
  string record_number   = 2;
  // subject_name volontairement omis (protection données)
}

message AnnualTableSnapshot {
  string annual_table_id    = 1;
  string registry_office_id = 2;
  string year               = 3;

  google.protobuf.Timestamp generated_at = 10;
  google.protobuf.Timestamp validated_at = 11;

  repeated AnnualTableItem items = 20;
}

message AnnualTableGenerated { AnnualTableSnapshot table = 1; }
message AnnualTableValidated { AnnualTableSnapshot table = 1; }

message AnnualTableEvent {
  ci.ec.common.v1.EventEnvelope meta = 1;
  oneof payload {
    AnnualTableGenerated generated = 10;
    AnnualTableValidated validated = 11;
  }
}
